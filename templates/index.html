<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>


    <div class="container">
        <header>
            <div class="logo-wrap">
                <span class="logo-icon">🎬</span>
                <h1>Cine<span>Match</span></h1>
                
            </div>
            <p class="tagline">AI-powered movie recommendations, just for you.</p><br>
            <p class="sub">Describe your mood, a feeling, a memory — and we'll find your perfect watch tonight.</p>
        </header>

        <div class="input-section">
            <div class="textarea-wrap">
                <textarea id="userInput" placeholder="e.g., 'I want something thriller and mystery with an unpredictable twist...'"></textarea>
            </div>
            <button onclick="getRecommendations()" id="submitBtn">
                Find My Movies
            </button>
        </div>

        <div id="loader" class="hidden">
            <div class="loader-inner">
                <div class="film-strip">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <p>Scanning the archives...</p>
            </div>
        </div>

        <div id="results" class="movie-grid"></div>

        <footer>
            <p>Built with ♥ for cinema lovers</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
